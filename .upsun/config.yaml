applications:
  app:  # Standard naming convention
    type: "php:8.3"
    
    runtime:
      extensions:
        - xsl
        - sodium
        - redis
        - blackfire
        - bcmath
        - gd
        - intl
        - pdo_mysql
        - soap
        - zip
        - opcache
    
    container_profile: BALANCED
    
    variables:
      env:
        # Node.js for build process
        NVM_VERSION: v0.39.0
        NODE_VERSION: 20
        
        # Magento performance optimizations
        MAGENTO_DC_INDEXER__USE_APPLICATION_LOCK: true
        MAGENTO_INDEXER_BATCH_SIZE__CATALOGINVENTORY_STOCK__SIMPLE: 200
        MAGENTO_INDEXER_BATCH_SIZE__CATALOG_CATEGORY_PRODUCT: 666
        MAGENTO_INDEXER_BATCH_SIZE__CATALOGSEARCH_FULLTEXT__PARTIAL_REINDEX: 100
        MAGENTO_INDEXER_BATCH_SIZE__CATALOGSEARCH_FULLTEXT__MYSQL_GET: 500
        MAGENTO_INDEXER_BATCH_SIZE__CATALOGSEARCH_FULLTEXT__ELASTIC_SAVE: 500
        MAGENTO_INDEXER_BATCH_SIZE__CATALOG_PRODUCT_PRICE__SIMPLE: 200
        MAGENTO_INDEXER_BATCH_SIZE__CATALOG_PRODUCT_PRICE__DEFAULT: 500
        MAGENTO_INDEXER_BATCH_SIZE__CATALOG_PRODUCT_PRICE__CONFIGURABLE: 666
        
        # Adobe Commerce/Magento configs
        CONFIG__DEFAULT__SYSTEM__SMTP__DISABLE: 1
        CONFIG__DEFAULT__SYSTEM__FULL_PAGE_CACHE__CACHING_APPLICATION: 2
        CONFIG__DEFAULT__CATALOG__SEARCH__ENGINE: "opensearch"
        CONFIG__DEFAULT__WEB__SECURE__USE_IN_FRONTEND: 1
        CONFIG__DEFAULT__WEB__SECURE__USE_IN_ADMINHTML: 1
        CONFIG__DEFAULT__WEB__SEO__USE_REWRITES: 1
        
      php:
        memory_limit: "2G"
        max_execution_time: 18000
        max_input_vars: 10000
        opcache.memory_consumption: 512
        opcache.max_accelerated_files: 60000
    
    build:
      flavor: none
    
    dependencies:
      php:
        composer/composer: "^2"
    
    relationships:
      database:
        service: db
        endpoint: mysql
      redis:
        service: cache
        endpoint: redis
      redis-session:
        service: session
        endpoint: redis
      opensearch:
        service: search
        endpoint: opensearch
      rabbitmq:
        service: queue
        endpoint: rabbitmq
    
    mounts:
      "/var":
        source: storage
        source_path: "var"
      "/var/log":
        source: instance
        source_path: "log"
      "/app/etc":
        source: storage
        source_path: "etc"
      "/pub/media":
        source: storage
        source_path: "media"
      "/pub/static":
        source: storage
        source_path: "static"
      "/var/report":
        source: tmp
        source_path: "report"
    
    hooks:
      build: |
        set -e
        
        # Setup Node.js
        unset NPM_CONFIG_PREFIX
        export NVM_DIR="$PLATFORM_APP_DIR/.nvm"
        curl -f -o- https://raw.githubusercontent.com/nvm-sh/nvm/$NVM_VERSION/install.sh | bash
        [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
        nvm install $NODE_VERSION
        
        # Setup environment
        echo 'unset NPM_CONFIG_PREFIX' >> .environment
        echo 'export NO_UPDATE_NOTIFIER=1' >> .environment
        echo 'export NVM_DIR="$PLATFORM_APP_DIR/.nvm"' >> .environment
        echo '[ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"' >> .environment
        
        # Install Magento
        composer install --no-dev --no-interaction --optimize-autoloader
        
        # Check if using Adobe Commerce Cloud or Open Source
        if [ -f ./vendor/bin/ece-tools ]; then
          # Adobe Commerce Cloud
          php ./vendor/bin/ece-tools run scenario/build/generate.xml
          php ./vendor/bin/ece-tools run scenario/build/transfer.xml
        else
          # Open Source Magento
          # Generate DI and interceptors during build
          php bin/magento setup:di:compile
        fi
      
      deploy: |
        set -e
        
        if [ -f ./vendor/bin/ece-tools ]; then
          # Adobe Commerce Cloud
          php ./vendor/bin/ece-tools run scenario/deploy.xml
        else
          # Open Source deployment
          if [ ! -f app/etc/env.php ]; then
            # First time installation
            php bin/magento setup:install \
              --base-url=https://$PLATFORM_ROUTES_MAIN \
              --db-host=database.internal \
              --db-name=main \
              --db-user=user \
              --db-password="" \
              --backend-frontname=admin \
              --search-engine=opensearch \
              --opensearch-host=search.internal \
              --opensearch-port=9200 \
              --cache-backend=redis \
              --cache-backend-redis-server=cache.internal \
              --session-save=redis \
              --session-save-redis-host=session.internal \
              --use-rewrites=1 \
              --admin-firstname=Admin \
              --admin-lastname=User \
              --admin-email=admin@example.com \
              --admin-user=admin \
              --admin-password=Admin123! \
              --language=en_US \
              --currency=USD \
              --timezone=America/New_York
          else
            # Subsequent deployments
            php bin/magento setup:upgrade --keep-generated
          fi
          
          # Configure OpenSearch
          php bin/magento config:set catalog/search/engine opensearch
          php bin/magento config:set catalog/search/opensearch_server_hostname search.internal
          php bin/magento config:set catalog/search/opensearch_server_port 9200
          php bin/magento config:set catalog/search/opensearch_index_prefix magento2
          
          # Configure Redis
          php bin/magento setup:config:set --cache-backend=redis --cache-backend-redis-server=cache.internal
          php bin/magento setup:config:set --session-save=redis --session-save-redis-host=session.internal
          
          # Deploy static content
          php bin/magento setup:static-content:deploy -f en_US --jobs=$(nproc)
          
          # Set production mode
          php bin/magento deploy:mode:set production --skip-compilation
          
          # Enable caches
          php bin/magento cache:enable
        fi
      
      post_deploy: |
        set -e
        
        if [ -f ./vendor/bin/ece-tools ]; then
          php ./vendor/bin/ece-tools run scenario/post-deploy.xml
        else
          php bin/magento indexer:reindex
          php bin/magento cache:flush
        fi
    
    crons:
      magento:
        spec: "*/5 * * * *"
        cmd: "php bin/magento cron:run"
    
    web:
      locations:
        "/":
          root: "pub"
          passthru: "/index.php"
          index:
            - index.php
          expires: -1
          scripts: true
          allow: false
          rules:
            \.(css|js|map|hbs|gif|jpe?g|png|tiff|wbmp|ico|jng|bmp|svgz|midi?|mp?ga|mp2|mp3|m4a|ra|weba|3gpp?|mp4|mpe?g|mpe|ogv|mov|webm|flv|mng|asx|asf|wmv|avi|ogx|swf|jar|ttf|eot|woff|woff2|otf|html?|svg)$:
              allow: true
            ^/sitemap(.*)\.xml$:
              passthru: "/media/sitemap$1.xml"
        "/media":
          root: "pub/media"
          allow: true
          scripts: false
          expires: 1y
          passthru: "/get.php"
        "/static":
          root: "pub/static"
          allow: true
          scripts: false
          expires: 1y
          passthru: "/front-static.php"
          rules:
            ^/static/version\d+/(?<resource>.*)$:
              passthru: "/static/$resource"
    
    source:
      root: /

services:
  db:
    type: mariadb:10.6  # Or mysql:8.0 for MySQL
    configuration:
      properties:
        optimizer_switch: "rowid_filter=off"
        optimizer_use_condition_selectivity: 1
        max_allowed_packet: 64
      schemas:
        - main
      endpoints:
        mysql:
          default_schema: main
          privileges:
            main: admin
  
  cache:
    type: redis:7.2
    configuration:
      maxmemory_policy: allkeys-lru
  
  session:
    type: redis-persistent:7.2
    configuration:
      maxmemory_policy: allkeys-lru
  
  search:
    type: opensearch:2
    configuration:
      plugins:
        - analysis-phonetic
        - analysis-icu
  
  queue:
    type: rabbitmq:3.13

routes:
  "https://{default}/":
    type: upstream
    upstream: "app:http"
  
  "https://{default}/static/":
    type: upstream
    upstream: "app:http"
    cache:
      enabled: true
      cookies: []
  
  "https://{all}/":
    type: upstream
    upstream: "app:http"
  
  "https://{all}/static/":
    type: upstream
    upstream: "app:http"
    cache:
      enabled: true
      cookies: []