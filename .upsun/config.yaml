applications:
  app:  # Standard naming convention
    type: "php:8.3"
    
    runtime:
      extensions:
        - xsl
        - sodium
        - redis
        - blackfire
        - bcmath
        - gd
        - intl
        - pdo_mysql
        - soap
        - zip
        - opcache
    
    container_profile: BALANCED
    
    variables:
      env:
        # Node.js for build process
        NVM_VERSION: v0.39.0
        NODE_VERSION: 20
        
        # Magento performance optimizations
        MAGENTO_DC_INDEXER__USE_APPLICATION_LOCK: true
        MAGENTO_INDEXER_BATCH_SIZE__CATALOGINVENTORY_STOCK__SIMPLE: 200
        MAGENTO_INDEXER_BATCH_SIZE__CATALOG_CATEGORY_PRODUCT: 666
        MAGENTO_INDEXER_BATCH_SIZE__CATALOGSEARCH_FULLTEXT__PARTIAL_REINDEX: 100
        MAGENTO_INDEXER_BATCH_SIZE__CATALOGSEARCH_FULLTEXT__MYSQL_GET: 500
        MAGENTO_INDEXER_BATCH_SIZE__CATALOGSEARCH_FULLTEXT__ELASTIC_SAVE: 500
        MAGENTO_INDEXER_BATCH_SIZE__CATALOG_PRODUCT_PRICE__SIMPLE: 200
        MAGENTO_INDEXER_BATCH_SIZE__CATALOG_PRODUCT_PRICE__DEFAULT: 500
        MAGENTO_INDEXER_BATCH_SIZE__CATALOG_PRODUCT_PRICE__CONFIGURABLE: 666
        
        # Adobe Commerce/Magento configs
        CONFIG__DEFAULT__SYSTEM__SMTP__DISABLE: 1
        CONFIG__DEFAULT__SYSTEM__FULL_PAGE_CACHE__CACHING_APPLICATION: 2
        CONFIG__DEFAULT__CATALOG__SEARCH__ENGINE: "opensearch"
        CONFIG__DEFAULT__WEB__SECURE__USE_IN_FRONTEND: 1
        CONFIG__DEFAULT__WEB__SECURE__USE_IN_ADMINHTML: 1
        CONFIG__DEFAULT__WEB__SEO__USE_REWRITES: 1
        
      php:
        memory_limit: "2G"
        max_execution_time: 18000
        max_input_vars: 10000
        opcache.memory_consumption: 512
        opcache.max_accelerated_files: 60000
    
    build:
      flavor: none
    
    dependencies:
      php:
        composer/composer: "^2"
    
    relationships:
      database:
        service: db
        endpoint: mysql
      redis:
        service: cache
        endpoint: redis
      redis-session:
        service: session
        endpoint: redis
      opensearch:
        service: search
        endpoint: opensearch
      rabbitmq:
        service: queue
        endpoint: rabbitmq
    
    mounts:
      "/var":
        source: storage
        source_path: "var"
      "/pub/media":
        source: storage
        source_path: "media"
      "/pub/static":
        source: storage
        source_path: "static"
      "/generated":
        source: storage
        source_path: "generated"
      "/app/etc":
        source: storage
        source_path: "etc"
    
    hooks:
      build: |
        set -e

      deploy: ece-tools run scenario/post-deploy.xml
      install_cron: |
        set -e
        php bin/magento cron:install
      post_deploy: |
        set -e
        
        if [ -f ./vendor/bin/ece-tools ]; then
          php ./vendor/bin/ece-tools run scenario/post-deploy.xml
        else
          php bin/magento indexer:reindex
          php bin/magento cache:flush
        fi
    
    crons:
      magento:
        spec: "*/5 * * * *"
        cmd: "php bin/magento cron:run"
    
    web:
      locations:
        "/":
          root: "pub"
          passthru: "/index.php"
          index:
            - index.php
          expires: -1
          scripts: true
          allow: false
          rules:
            \.(css|js|map|hbs|gif|jpe?g|png|tiff|wbmp|ico|jng|bmp|svgz|midi?|mp?ga|mp2|mp3|m4a|ra|weba|3gpp?|mp4|mpe?g|mpe|ogv|mov|webm|flv|mng|asx|asf|wmv|avi|ogx|swf|jar|ttf|eot|woff|woff2|otf|html?|svg)$:
              allow: true
            ^/sitemap(.*)\.xml$:
              passthru: "/media/sitemap$1.xml"
        "/media":
          root: "pub/media"
          allow: true
          scripts: false
          expires: 1y
          passthru: "/get.php"
        "/static":
          root: "pub/static"
          allow: true
          scripts: false
          expires: 1y
          passthru: "/front-static.php"
          rules:
            ^/static/version\d+/(?<resource>.*)$:
              passthru: "/static/$resource"
    
    source:
      root: /

services:
  db:
    type: mariadb:10.6  # Or mysql:8.0 for MySQL
    configuration:
      properties:
        optimizer_switch: "rowid_filter=off"
        optimizer_use_condition_selectivity: 1
        max_allowed_packet: 64
      schemas:
        - main
      endpoints:
        mysql:
          default_schema: main
          privileges:
            main: admin
  
  cache:
    type: redis:7.2
    configuration:
      maxmemory_policy: allkeys-lru
  
  session:
    type: redis-persistent:7.2
    configuration:
      maxmemory_policy: allkeys-lru
  
  search:
    type: opensearch:2
    configuration:
      plugins:
        - analysis-phonetic
        - analysis-icu
  
  queue:
    type: rabbitmq:3.13

routes:
  "https://{default}/":
    type: upstream
    upstream: "app:http"
  
  "https://{default}/static/":
    type: upstream
    upstream: "app:http"
    cache:
      enabled: true
      cookies: []
  
  "https://{all}/":
    type: upstream
    upstream: "app:http"
  
  "https://{all}/static/":
    type: upstream
    upstream: "app:http"
    cache:
      enabled: true
      cookies: []