applications:
  app:  # Standard naming convention
    type: "php:8.3"
    
    runtime:
      extensions:
        - xsl
        - sodium
        - redis
        - blackfire
        - bcmath
        - gd
        - intl
        - pdo_mysql
        - soap
        - zip
        - opcache
    
    container_profile: BALANCED
    
    variables:
      env:
        # Node.js for build process
        NVM_VERSION: v0.39.0
        NODE_VERSION: 20
        
        # Magento performance optimizations
        MAGENTO_DC_INDEXER__USE_APPLICATION_LOCK: true
        MAGENTO_INDEXER_BATCH_SIZE__CATALOGINVENTORY_STOCK__SIMPLE: 200
        MAGENTO_INDEXER_BATCH_SIZE__CATALOG_CATEGORY_PRODUCT: 666
        MAGENTO_INDEXER_BATCH_SIZE__CATALOGSEARCH_FULLTEXT__PARTIAL_REINDEX: 100
        MAGENTO_INDEXER_BATCH_SIZE__CATALOGSEARCH_FULLTEXT__MYSQL_GET: 500
        MAGENTO_INDEXER_BATCH_SIZE__CATALOGSEARCH_FULLTEXT__ELASTIC_SAVE: 500
        MAGENTO_INDEXER_BATCH_SIZE__CATALOG_PRODUCT_PRICE__SIMPLE: 200
        MAGENTO_INDEXER_BATCH_SIZE__CATALOG_PRODUCT_PRICE__DEFAULT: 500
        MAGENTO_INDEXER_BATCH_SIZE__CATALOG_PRODUCT_PRICE__CONFIGURABLE: 666
        
        # Adobe Commerce/Magento configs
        CONFIG__DEFAULT__SYSTEM__SMTP__DISABLE: 1
        CONFIG__DEFAULT__SYSTEM__FULL_PAGE_CACHE__CACHING_APPLICATION: 2
        CONFIG__DEFAULT__CATALOG__SEARCH__ENGINE: "opensearch"
        CONFIG__DEFAULT__WEB__SECURE__USE_IN_FRONTEND: 1
        CONFIG__DEFAULT__WEB__SECURE__USE_IN_ADMINHTML: 1
        CONFIG__DEFAULT__WEB__SEO__USE_REWRITES: 1
        
      php:
        memory_limit: "2G"
        max_execution_time: 18000
        max_input_vars: 10000
        opcache.memory_consumption: 512
        opcache.max_accelerated_files: 60000
    
    build:
      flavor: none
    
    dependencies:
      php:
        composer/composer: "^2"
    
    relationships:
      database:
        service: db
        endpoint: mysql
      redis:
        service: cache
        endpoint: redis
      redis-session:
        service: session
        endpoint: redis
      opensearch:
        service: search
        endpoint: opensearch
      rabbitmq:
        service: queue
        endpoint: rabbitmq
    
    mounts:
      "/var":
        source: storage
        source_path: "var"
      "/pub/media":
        source: storage
        source_path: "media"
      "/pub/static":
        source: storage
        source_path: "static"
      "/generated":
        source: storage
        source_path: "generated"
    
    hooks:
      build: |
        set -e

        # Setup Node.js
        unset NPM_CONFIG_PREFIX
        export NVM_DIR="$PLATFORM_APP_DIR/.nvm"
        curl -f -o- https://raw.githubusercontent.com/nvm-sh/nvm/$NVM_VERSION/install.sh | bash
        [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
        nvm install $NODE_VERSION

        # Setup environment
        echo 'unset NPM_CONFIG_PREFIX' >> .environment
        echo 'export NO_UPDATE_NOTIFIER=1' >> .environment
        echo 'export NVM_DIR="$PLATFORM_APP_DIR/.nvm"' >> .environment
        echo '[ -s "$NVM_DIR/nvm.sh" ] && . "$NVM_DIR/nvm.sh"' >> .environment

        # Install Magento
        composer install --no-dev --no-interaction --optimize-autoloader

        # Create env.php that dynamically configures based on available services
        php -d display_errors=0 << 'PHPSCRIPT'
        <?php
        $envphp = '<?php
        $relationships = [];
        if (isset($_ENV["PLATFORM_RELATIONSHIPS"])) {
            $relationships = json_decode(base64_decode($_ENV["PLATFORM_RELATIONSHIPS"]), true) ?? [];
        }
        $db = $relationships["database"][0] ?? null;
        $redis = $relationships["redis"][0] ?? null;
        $redis_session = $relationships["redis-session"][0] ?? null;
        $config = [
            "backend" => ["frontName" => "admin"],
            "install" => ["date" => "' . date('r') . '"],
            "crypt" => ["key" => "' . bin2hex(random_bytes(16)) . '"]
        ];
        if ($db) {
            $config["db"] = ["table_prefix" => "", "connection" => ["default" => ["host" => $db["host"], "dbname" => $db["path"], "username" => $db["username"], "password" => $db["password"], "model" => "mysql4", "engine" => "innodb", "initStatements" => "SET NAMES utf8;", "active" => "1"]]];
        }
        if ($redis) {
            $config["cache"] = ["frontend" => ["default" => ["backend" => "Magento\\\\Framework\\\\Cache\\\\Backend\\\\Redis", "backend_options" => ["server" => $redis["host"], "port" => $redis["port"], "database" => "0"]]]];
        }
        if ($redis_session) {
            $config["session"] = ["save" => "redis", "redis" => ["host" => $redis_session["host"], "port" => $redis_session["port"], "database" => "2"]];
        }
        return $config;
        ';
        file_put_contents("app/etc/env.php", $envphp);
        ?>
        PHPSCRIPT

        # Check if using Adobe Commerce Cloud or Open Source
        if [ -f ./vendor/bin/ece-tools ]; then
          # Adobe Commerce Cloud - use ece-tools for build
          php ./vendor/bin/ece-tools run scenario/build/generate.xml
          php ./vendor/bin/ece-tools run scenario/build/transfer.xml
        fi
        # For Open Source: Skip DI compilation in build (no services available)
        # It will be done during first deploy when DB/Redis are available
      
      deploy: |
        set -e

        if [ -f ./vendor/bin/ece-tools ]; then
          # Adobe Commerce Cloud
          php ./vendor/bin/ece-tools run scenario/deploy.xml
        else
          # Open Source deployment
          # env.php already created in build and reads from runtime environment

          # Compile DI if needed (first deployment or after code changes)
          if [ ! -d generated/code ] || [ ! "$(ls -A generated/code)" ]; then
            echo "Running DI compilation (first deployment)..."
            php bin/magento setup:di:compile
          fi

          # Check if database has data (not just schema)
          export RELATIONSHIPS_JSON=$(echo $PLATFORM_RELATIONSHIPS | base64 -d)
          DB_HAS_DATA=$(php -r '
          $rel = json_decode($_SERVER["RELATIONSHIPS_JSON"], true);
          $db = $rel["database"][0];
          try {
              $pdo = new PDO("mysql:host={$db["host"]};port={$db["port"]};dbname={$db["path"]}", $db["username"], $db["password"]);
              // Check if entity types exist (critical Magento data)
              $result = $pdo->query("SELECT COUNT(*) FROM eav_entity_type WHERE entity_type_code=\"customer\"")->fetchColumn();
              echo ($result > 0) ? "yes" : "no";
          } catch (Exception $e) {
              echo "no";
          }
          ')

          if [ "$DB_HAS_DATA" = "no" ]; then
            echo "Database needs initialization..."
            # Force database schema and data installation
            php bin/magento setup:db-schema:upgrade || true
            php bin/magento setup:db-data:upgrade || true
          fi

          # Run setup:upgrade to create/update database schema and data
          php bin/magento setup:upgrade --keep-generated

          # Create admin user (only runs on first deployment)
          php bin/magento admin:user:create \
            --admin-user=admin \
            --admin-password=Admin123! \
            --admin-email=admin@example.com \
            --admin-firstname=Admin \
            --admin-lastname=User || true

          # Configure OpenSearch
          export RELATIONSHIPS_JSON=$(echo $PLATFORM_RELATIONSHIPS | base64 -d)
          export OPENSEARCH_HOST=$(echo $RELATIONSHIPS_JSON | php -r "echo json_decode(file_get_contents('php://stdin'), true)['opensearch'][0]['host'];")
          export OPENSEARCH_PORT=$(echo $RELATIONSHIPS_JSON | php -r "echo json_decode(file_get_contents('php://stdin'), true)['opensearch'][0]['port'];")

          php bin/magento config:set catalog/search/engine opensearch
          php bin/magento config:set catalog/search/opensearch_server_hostname "$OPENSEARCH_HOST"
          php bin/magento config:set catalog/search/opensearch_server_port "$OPENSEARCH_PORT"
          php bin/magento config:set catalog/search/opensearch_index_prefix magento2

          # Deploy static content (no need to compile DI again, done in build)
          php bin/magento setup:static-content:deploy -f en_US --jobs=$(nproc)

          # Set production mode (skip compilation since we already did it in build)
          php bin/magento deploy:mode:set production --skip-compilation

          # Enable caches
          php bin/magento cache:enable
        fi
      
      post_deploy: |
        set -e
        
        if [ -f ./vendor/bin/ece-tools ]; then
          php ./vendor/bin/ece-tools run scenario/post-deploy.xml
        else
          php bin/magento indexer:reindex
          php bin/magento cache:flush
        fi
    
    crons:
      magento:
        spec: "*/5 * * * *"
        cmd: "php bin/magento cron:run"
    
    web:
      locations:
        "/":
          root: "pub"
          passthru: "/index.php"
          index:
            - index.php
          expires: -1
          scripts: true
          allow: false
          rules:
            \.(css|js|map|hbs|gif|jpe?g|png|tiff|wbmp|ico|jng|bmp|svgz|midi?|mp?ga|mp2|mp3|m4a|ra|weba|3gpp?|mp4|mpe?g|mpe|ogv|mov|webm|flv|mng|asx|asf|wmv|avi|ogx|swf|jar|ttf|eot|woff|woff2|otf|html?|svg)$:
              allow: true
            ^/sitemap(.*)\.xml$:
              passthru: "/media/sitemap$1.xml"
        "/media":
          root: "pub/media"
          allow: true
          scripts: false
          expires: 1y
          passthru: "/get.php"
        "/static":
          root: "pub/static"
          allow: true
          scripts: false
          expires: 1y
          passthru: "/front-static.php"
          rules:
            ^/static/version\d+/(?<resource>.*)$:
              passthru: "/static/$resource"
    
    source:
      root: /

services:
  db:
    type: mariadb:10.6  # Or mysql:8.0 for MySQL
    configuration:
      properties:
        optimizer_switch: "rowid_filter=off"
        optimizer_use_condition_selectivity: 1
        max_allowed_packet: 64
      schemas:
        - main
      endpoints:
        mysql:
          default_schema: main
          privileges:
            main: admin
  
  cache:
    type: redis:7.2
    configuration:
      maxmemory_policy: allkeys-lru
  
  session:
    type: redis-persistent:7.2
    configuration:
      maxmemory_policy: allkeys-lru
  
  search:
    type: opensearch:2
    configuration:
      plugins:
        - analysis-phonetic
        - analysis-icu
  
  queue:
    type: rabbitmq:3.13

routes:
  "https://{default}/":
    type: upstream
    upstream: "app:http"
  
  "https://{default}/static/":
    type: upstream
    upstream: "app:http"
    cache:
      enabled: true
      cookies: []
  
  "https://{all}/":
    type: upstream
    upstream: "app:http"
  
  "https://{all}/static/":
    type: upstream
    upstream: "app:http"
    cache:
      enabled: true
      cookies: []